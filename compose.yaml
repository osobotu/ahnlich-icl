services:
  ahnlich_db:
    image: ghcr.io/deven96/ahnlich-db:0.3.2
    command: >
      "ahnlich-db run --host 0.0.0.0
      --enable-persistence
      --persist-location /root/.ahnlich/data/db.dat
      --persistence-interval 30"
    volumes:
      - ahnlich_data:/root/.ahnlich/data
    ports:
      - "1369:1369"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "echo 'PING' | ahnlich-cli ahnlich --agent db --host 127.0.0.1 --port 1369 --no-interactive",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  ahnlich_ai:
    image: ghcr.io/deven96/ahnlich-ai:0.4.1
    command: >
      "ahnlich-ai run --db-host ahnlich_db --host 0.0.0.0
      --supported-models all-minilm-l6-v2
      --enable-persistence
      --persist-location /root/.ahnlich/data/ai.dat
      --persistence-interval 30"
    volumes:
      - ahnlich_models:/root/.ahnlich/models
      - ahnlich_data:/root/.ahnlich/data
    ports:
      - "1370:1370"
    depends_on:
      ahnlich_db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "echo 'PING' | ahnlich-cli ahnlich --agent ai --host 127.0.0.1 --port 1370 --no-interactive",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  ahnlich_data:
  ahnlich_models: