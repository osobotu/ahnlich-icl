[project]
name = "ahnlich-icl"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "ahnlich-mcp==0.1.2",
    "mcp>=1.27,<2",
    "openai>=3.10.0",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ahnlich_icl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[mcp_servers.ahnlich]
command = "uv"
args = ["run", "ahnlich-mcp", "--profile", "ai"]
env = { AHNLICH_MCP_READ_ONLY = "true" }
enabled_tools = ["ping", "similarity_search"]
