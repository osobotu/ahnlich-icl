[project]
name = "ahnlich-icl"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "ahnlich-mcp==0.1.2",
    "matplotlib>=3.11.1",
    "mcp>=1.27,<2",
    "nltk>=3.10.3",
    "openai>=3.10.0",
    "sqlparse>=0.6.0",
    "tqdm>=4.70.0",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ahnlich_icl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
